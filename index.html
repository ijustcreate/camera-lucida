<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11110f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lucida" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2311110f'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23c9b59d' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23c9b59d'/%3E%3C/svg%3E" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Lucida — Draw from light</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" id="appShell">
      <section class="welcome" id="welcome" aria-labelledby="welcomeTitle">
        <div class="welcome__topline">
          <span class="mark" aria-hidden="true"></span>
          <span>Camera lucida</span>
        </div>
        <div class="welcome__copy">
          <p class="eyebrow">A quiet drawing surface</p>
          <h1 id="welcomeTitle">Draw from<br />what you see.</h1>
          <p>Place an image on the page, lower it to a whisper, and trace at your own pace.</p>
        </div>
        <div class="source-actions">
          <button class="source-button source-button--primary" id="openCameraButton" type="button">
            <span class="source-button__glyph" aria-hidden="true">◉</span>
            Use camera
          </button>
          <button class="source-button" id="openPhotosButton" type="button">
            <span class="source-button__glyph" aria-hidden="true">▧</span>
            Choose a photo
          </button>
        </div>
        <p class="welcome__hint">For the best canvas, turn your phone sideways after choosing an image.</p>
      </section>

      <section class="studio" id="studio" aria-label="Camera lucida drawing workspace" hidden>
        <header class="studio-header">
          <button class="icon-button" id="newReferenceButton" type="button" aria-label="Choose another reference image" title="Choose another reference image">
            <span aria-hidden="true">＋</span>
          </button>
          <div class="studio-title" aria-label="Camera lucida">
            <span class="mark mark--small" aria-hidden="true"></span>
            <span>Lucida</span>
          </div>
          <button class="icon-button" id="fullScreenButton" type="button" aria-label="Toggle full screen" title="Toggle full screen">
            <span aria-hidden="true">⛶</span>
          </button>
        </header>

        <div class="drawing-stage" id="drawingStage">
          <div class="reference-wrap" id="referenceWrap" aria-hidden="true">
            <img class="reference-media reference-image" id="referenceImage" alt="" />
            <video class="reference-media reference-video" id="referenceVideo" autoplay muted playsinline hidden></video>
            <div class="gesture-layer" id="gestureLayer"></div>
          </div>
          <canvas id="drawingCanvas" aria-label="Your drawing canvas"></canvas>
          <div class="stage-note" id="stageNote">Move the image with one finger. Pinch to scale.</div>
        </div>

        <section class="control-dock" aria-label="Drawing controls">
          <div class="tool-row" role="group" aria-label="Tool">
            <button class="tool-button is-active" type="button" data-tool="draw" aria-pressed="true">
              <span class="tool-icon" aria-hidden="true">✎</span><span>Draw</span>
            </button>
            <button class="tool-button" type="button" data-tool="move" aria-pressed="false">
              <span class="tool-icon" aria-hidden="true">✥</span><span>Move</span>
            </button>
            <button class="tool-button" type="button" data-tool="erase" aria-pressed="false">
              <span class="tool-icon" aria-hidden="true">⌫</span><span>Erase</span>
            </button>
          </div>

          <div class="control-row">
            <label class="dial-control" for="opacityRange">
              <span class="dial-control__cap"><span class="dial-control__notch" id="opacityNotch"></span></span>
              <span class="dial-control__label">Image</span>
              <input id="opacityRange" type="range" min="5" max="100" value="54" aria-label="Reference image opacity" />
              <output id="opacityValue" for="opacityRange">54%</output>
            </label>
            <label class="dial-control dial-control--small" for="brushRange">
              <span class="dial-control__cap"><span class="dial-control__notch" id="brushNotch"></span></span>
              <span class="dial-control__label">Line</span>
              <input id="brushRange" type="range" min="1" max="16" value="3" aria-label="Line thickness" />
              <output id="brushValue" for="brushRange">3</output>
            </label>
            <button class="round-action" id="undoButton" type="button" aria-label="Undo last line" title="Undo last line"><span aria-hidden="true">↶</span></button>
            <button class="round-action round-action--subtle" id="clearButton" type="button" aria-label="Clear drawing" title="Clear drawing"><span aria-hidden="true">×</span></button>
          </div>
        </section>
      </section>
    </main>

    <input id="photoInput" type="file" accept="image/*" hidden />

    <dialog class="camera-sheet" id="cameraSheet" aria-labelledby="cameraTitle">
      <div class="camera-sheet__bar"></div>
      <div class="camera-sheet__header">
        <h2 id="cameraTitle">Frame your reference</h2>
        <button class="icon-button" id="closeCameraButton" type="button" aria-label="Close camera">×</button>
      </div>
      <div class="camera-preview">
        <video id="cameraVideo" playsinline autoplay muted></video>
        <p class="camera-message" id="cameraMessage" hidden></p>
      </div>
      <div class="camera-sheet__actions">
        <button class="source-button source-button--primary" id="startLiveCameraButton" type="button">Trace with live camera</button>
        <div class="camera-sheet__secondary-actions">
          <button class="source-button" id="cameraPhotoButton" type="button">Choose a photo</button>
          <button class="capture-button" id="captureButton" type="button" aria-label="Capture a still photo"><span></span></button>
        </div>
      </div>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
